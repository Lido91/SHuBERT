# @package _global_
# Second stage: masked cluster prediction plus SeRV-style alignment to a frozen T5 encoder.
# Starts from a masked-prediction checkpoint (model.init_checkpoint) and needs prepared captions.
common:
  fp16: false
  log_format: json
  log_interval: 20
  seed: 1

checkpoint:
  save_interval_updates: 10000
  keep_interval_updates: 2
  no_epoch_checkpoints: true

task:
  _name: pose_pretraining
  data: ???
  captions: ???
  stream_names: [body, left_hand, right_hand]
  stream_dims: [14, 42, 42]
  codebook_size: 256
  min_frames: 2
  max_frames: 256

dataset:
  num_workers: 4
  max_tokens: 15000
  required_batch_size_multiple: 1
  disable_validation: true

distributed_training:
  distributed_world_size: 1
  ddp_backend: legacy_ddp

criterion:
  _name: model
  # Untuned starting point: the two alignment terms together weigh as much as the cluster loss.
  loss_weights:
    kmeans_loss: 1.0
    sent_nce_loss: 0.5
    token_nce_loss: 0.5

optimization:
  max_update: 400000
  lr: [0.0001]
  update_freq: [8]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-06
  weight_decay: 0.01

lr_scheduler:
  _name: polynomial_decay
  warmup_updates: 32000

model:
  _name: shubert_pose
  stream_names: ${task.stream_names}
  stream_dims: ${task.stream_dims}
  codebook_size: ${task.codebook_size}
  stream_embed_dim: 256
  encoder_embed_dim: 768
  encoder_layers: 12
  encoder_ffn_embed_dim: 3072
  encoder_attention_heads: 12
  encoder_layerdrop: 0.05
  conv_pos: 128
  conv_pos_groups: 16
  required_seq_len_multiple: 2
  mask_strategy: random
  mask_prob: 0.8
  mask_length: 3
  semantic: true
  text_model: ???
  text_dim: 768
  align_dim: 768
  sent_tau: 0.07
  token_align: true
  token_tau: 0.07
  token_top_ratio: 0.25
  semantic_gather: true
  init_checkpoint: ???

hydra:
  run:
    dir: ${checkpoint.save_dir}
